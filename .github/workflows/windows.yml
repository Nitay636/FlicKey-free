name: Windows build

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['win-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unit tests
        run: dotnet test windows/tests/FlicKey.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish windows/src/FlicKey.Windows -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: Name the artifact
        shell: pwsh
        run: Move-Item publish/FlicKey.exe publish/FlicKey-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FlicKey-windows-x64
          path: publish/FlicKey-windows-x64.exe

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/win-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "FlicKey for Windows ($tag)" --notes "Windows x64 build. Double-tap Shift to fix wrong-layout text."
          }
          gh release upload $tag publish/FlicKey-windows-x64.exe --clobber
